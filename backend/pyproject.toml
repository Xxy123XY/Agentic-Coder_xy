[project]
name = "multi-agent-orchestrator"
version = "0.1.0"
description = "Autonomous multi-agent system for GitHub issue resolution"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bug patterns)
    "UP",  # pyupgrade (modern Python syntax)
    "N",   # naming conventions
]
ignore = ["E501"]  # line too long — black handles formatting

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]  # allow non-snake_case in test names

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.venv
  | alembic/versions
)/
'''

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["alembic/versions", ".venv"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: fast isolated tests",
    "integration: multi-component tests",
    "e2e: full pipeline tests (slow, needs Docker)",
]